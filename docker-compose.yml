services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DEBUG: "false"
      RESUME_MATCHER_DATA_DIR: /app/data
      RESUME_MATCHER_CORS_ORIGINS: ${RESUME_MATCHER_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - resume_matcher_data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://127.0.0.1:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
volumes:
  resume_matcher_data:
